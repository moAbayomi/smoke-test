
# fly.toml app configuration file generated for my-protohacker-snoketest

app = 'my-protohacker-snoketest'
primary_region = 'lhr'

[build]

[[services]]
  internal_port = 6969
  protocol = "tcp"
  auto_stop_machines = "off"  
  auto_start_machines = true

  [[services.ports]]
    handlers = []              
    port = 6969

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
